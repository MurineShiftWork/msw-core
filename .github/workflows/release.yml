name: Release

# Publish only. Triggered by a tag: versioning.yml pushes it with the App token,
# or by hand; workflow_dispatch republishes an existing tag. Stays named release.yml
# so the PyPI trusted-publisher (OIDC) binding is unchanged.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.2)'
        required: true

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ github.event.inputs.tag || github.ref }}"
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.tag || github.ref_name }}"
          files: dist/*
          generate_release_notes: false
      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic
